name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A failed test that has to be read from a wall of output is a failed test
  # nobody reads.
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no database, so a formatting slip or a lint failure
  # comes back in a minute rather than after the container suite.
  check:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  # `rust-version` in Cargo.toml is a promise. This is what keeps it one.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml declares MSRV $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Only what gets published. `--all-targets` would drag in the test-only
      # dependencies, which carry their own, higher floors — failing the job for
      # something no consumer of the crate is affected by.
      - name: Library and binary build on the declared MSRV
        run: |
          cargo check -p vision-graphql --lib
          cargo check -p vision-graphql-cli --bins
      - name: Both crates declare the same MSRV
        run: |
          lib=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          cli=$(grep -m1 '^rust-version' crates/vision-graphql-cli/Cargo.toml | cut -d'"' -f2)
          test "$lib" = "$cli" || { echo "MSRV mismatch: lib $lib, cli $cli"; exit 1; }

  test:
    name: tests
    runs-on: ubuntu-latest

    # One PostgreSQL for the whole run. The tests would otherwise start a
    # container per test binary through testcontainers, and two dozen
    # `docker create` calls arriving together is how a runner ends up answering
    # one of them with a timeout. Each test still gets a database of its own on
    # this server, so nothing is shared but the process.
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # nextest schedules every binary's tests through one pool, which `cargo
      # test` cannot — it runs test *binaries* in parallel with no shared
      # budget. With the service container above there are no containers to
      # race for, so the cap here is only about how much a runner can chew.
      - name: Tests
        run: cargo nextest run --workspace --test-threads 4

      # nextest does not run doctests; the examples in the docs are part of the
      # public surface and go stale silently otherwise.
      - name: Doctests
        run: cargo test --workspace --doc
